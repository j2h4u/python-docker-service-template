name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - ".planning/**"
      - "docs/**"
      - "**/*.md"
  pull_request:
    branches: [main]
  schedule:
    - cron: "37 21 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  UV_LINK_MODE: hardlink

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-release-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Skip outside pull requests
        if: github.event_name != 'pull_request'
        run: echo "release contract is a pull-request check"

      - uses: actions/checkout@v7.0.1
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v7.0.0
        if: github.event_name == 'pull_request'
        with:
          python-version: "3.14"

      - uses: astral-sh/setup-uv@v10.0.1
        if: github.event_name == 'pull_request'
        with:
          enable-cache: true

      - name: Validate releasable PR title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: uv run python scripts/validate_pr_title.py --title "${PR_TITLE}"

      - name: Validate PR commit subjects
        if: ${{ github.event_name == 'pull_request' && !startsWith(github.event.pull_request.head.ref, 'dependabot/') }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: uv run python -m scripts.validate_pr_commits --base-sha "${BASE_SHA}" --head-sha "${HEAD_SHA}"

      - name: Validate release-note override
        if: ${{ github.event_name == 'pull_request' && !startsWith(github.event.pull_request.head.ref, 'release-please--') }}
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          count="$(git rev-list --no-merges --count "${BASE_SHA}..${HEAD_SHA}")"
          printf '%s' "${PR_BODY}" \
            | uv run python -m scripts.validate_release_notes --body-file - --commit-count "${count}"

  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.classify.outputs.code }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: classify
        name: Classify changed files
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
          else
            base="${{ github.event.before }}"
            head="${{ github.sha }}"
            if [[ "$base" =~ ^0+$ ]]; then
              echo "code=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          git diff --name-only "$base" "$head" > changed-files.txt
          if [ ! -s changed-files.txt ]; then
            echo "code=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if grep -Ev '^(\.planning/|docs/.*|README\.md$|AGENTS\.md$|LICENSE$|.*\.md$)' changed-files.txt >/dev/null; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  quality:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.14"

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - uses: taiki-e/install-action@v2
        with:
          tool: just

      - name: Install dependencies
        run: uv sync --locked

      - name: Static quality gate
        run: just check

  test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.14"

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - uses: taiki-e/install-action@v2
        with:
          tool: just

      - name: Install dependencies
        run: uv sync --locked

      - name: Unit tests
        run: just unit

  crap:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.14"

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - uses: taiki-e/install-action@v2
        with:
          tool: just

      - name: Install dependencies
        run: uv sync --locked

      - name: CRAP gate
        run: just crap-check

  deps-audit:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.14"

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - uses: taiki-e/install-action@v2
        with:
          tool: just

      - name: Install dependencies
        run: uv sync --locked

      - name: Locked dependency vulnerability audit
        run: just deps-audit

  docker-build:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@v4.3.0

      - name: Build Docker image
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: Dockerfile
          push: false
          tags: python-docker-service-template:ci

  runtime-smoke:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: taiki-e/install-action@v2
        with:
          tool: just

      - name: Runtime smoke
        run: just runtime-smoke

  ci:
    if: always()
    runs-on: ubuntu-latest
    needs: [pr-release-contract, changes, quality, test, crap, deps-audit, docker-build, runtime-smoke]
    steps:
      - name: Check required jobs
        run: |
          if [ "${{ contains(needs.*.result, 'failure') }}" = "true" ] || \
             [ "${{ contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            exit 1
          fi
          if [ "${{ needs.changes.outputs.code }}" = "true" ] && \
             [ "${{ contains(needs.*.result, 'skipped') }}" = "true" ]; then
            exit 1
          fi
