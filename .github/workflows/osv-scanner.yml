name: OSV Scanner

on:
  schedule:
    - cron: "19 2 8 * *"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  scan:
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
    with:
      scan-args: --lockfile=uv.lock
      fail-on-vuln: false
      upload-sarif: false
