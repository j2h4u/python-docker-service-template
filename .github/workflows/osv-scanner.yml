name: OSV Scanner

on:
  schedule:
    - cron: "19 2 8 * *"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  scan:
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@32d3cd482bdadfb38b186c0ad1b031902d55d932 # v2.7.1
    with:
      scan-args: --lockfile=uv.lock
      fail-on-vuln: false
      upload-sarif: false
