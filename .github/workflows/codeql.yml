name: CodeQL

on:
  push:
    branches: [main]
    paths-ignore:
      - ".planning/**"
      - "docs/**"
      - "**/*.md"
  pull_request:
    branches: [main]
  schedule:
    - cron: "27 7 1 * *"
  workflow_dispatch:

jobs:
  analyze:
    name: Analyze Python
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Detect code scanning availability
        id: code-scanning
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh api "repos/${{ github.repository }}/code-scanning/alerts" >/dev/null 2>&1; then
            echo "upload=always" >> "$GITHUB_OUTPUT"
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.repository.private }}" = "true" ]; then
            echo "Code scanning is unavailable for this private repository; skipping CodeQL analysis."
            echo "upload=never" >> "$GITHUB_OUTPUT"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Code scanning availability check failed for a public repository"
            exit 1
          fi

      - name: Skip unsupported CodeQL upload
        if: steps.code-scanning.outputs.enabled != 'true'
        run: echo "Code scanning is unavailable for this private repository; skipping CodeQL analysis."

      - name: Initialize CodeQL
        if: steps.code-scanning.outputs.enabled == 'true'
        uses: github/codeql-action/init@v4.38.1
        with:
          languages: python
          queries: security-extended

      - name: Perform CodeQL Analysis
        if: steps.code-scanning.outputs.enabled == 'true'
        uses: github/codeql-action/analyze@v4.38.1
        with:
          category: "/language:python"
          upload: ${{ steps.code-scanning.outputs.upload }}
